name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  EDGE_BASE_VERSION: 0.1.0

concurrency:
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'edge' || github.run_id }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve build metadata
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish=true
          version=$EDGE_BASE_VERSION
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            publish=$(tools/check-edge-current.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA")
            if [ "$publish" = true ]; then
              version=$(tools/next-edge-version.sh "$EDGE_BASE_VERSION" "$GITHUB_REPOSITORY" "$GITHUB_SHA")
            else
              printf 'Skipping stale edge run for %s\n' "$GITHUB_SHA"
            fi
          fi
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  check:
    needs: metadata
    if: needs.metadata.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            blacksmith: blacksmith-2vcpu-ubuntu-2404
            hosted: ubuntu-latest
          - os: macos
            blacksmith: blacksmith-6vcpu-macos-latest
            hosted: macos-latest
    name: check (${{ matrix.os }})
    # Fork PRs cannot reach org-billed Blacksmith runners; fall back to GitHub-hosted.
    runs-on: ${{ github.event.pull_request.head.repo.fork && matrix.hosted || matrix.blacksmith }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check build.zig src tools
      - run: zig build test
      - run: zig build -Doptimize=ReleaseSmall
      - name: Shell checks
        if: runner.os == 'Linux'
        run: |
          shellcheck install.sh tools/*.sh tests/*.sh
          tests/edge_freshness_test.sh
          tests/edge_version_test.sh
          tests/edge_release_test.sh
          tests/install_test.sh
          tests/publish_edge_test.sh
          tests/version_test.sh
      - name: Size and startup budget
        if: runner.os == 'Linux'
        run: zig build perf

  package:
    needs: metadata
    if: needs.metadata.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            target: x86_64-linux
            blacksmith: blacksmith-2vcpu-ubuntu-2404
            hosted: ubuntu-latest
          - platform: linux-aarch64
            target: aarch64-linux
            blacksmith: blacksmith-2vcpu-ubuntu-2404
            hosted: ubuntu-latest
          - platform: macos-x86_64
            target: x86_64-macos
            blacksmith: blacksmith-6vcpu-macos-latest
            hosted: macos-latest
          - platform: macos-aarch64
            target: aarch64-macos
            blacksmith: blacksmith-6vcpu-macos-latest
            hosted: macos-latest
    name: package (${{ matrix.platform }})
    runs-on: ${{ github.event.pull_request.head.repo.fork && matrix.hosted || matrix.blacksmith }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build edge package
        run: tools/package-edge.sh "${{ matrix.platform }}" "${{ matrix.target }}" "${GITHUB_SHA}" "${{ needs.metadata.outputs.version }}"
      - name: Upload edge binary
        uses: actions/upload-artifact@v7
        with:
          path: dist/xaq-${{ matrix.platform }}-${{ github.sha }}
          archive: false
          if-no-files-found: error
          retention-days: 1
      - name: Upload edge archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/xaq-${{ matrix.platform }}-${{ github.sha }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 1

  edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.metadata.outputs.publish == 'true'
    needs: [metadata, check, package]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download edge builds
        uses: actions/download-artifact@v8
        with:
          # upload-artifact v7 names an archive:false artifact after its one file.
          pattern: xaq-*
          path: dist
          merge-multiple: true
      - name: Prepare edge manifest
        run: tools/prepare-edge.sh dist "${GITHUB_SHA}" "${{ needs.metadata.outputs.version }}"
      - name: Publish edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/publish-edge.sh dist "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" "${{ needs.metadata.outputs.version }}"
