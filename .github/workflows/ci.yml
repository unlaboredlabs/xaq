name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-2vcpu-ubuntu-2404, blacksmith-6vcpu-macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check build.zig src tools
      - run: zig build test
      - run: zig build -Doptimize=ReleaseSmall
      - name: Shell checks
        if: runner.os == 'Linux'
        run: |
          shellcheck install.sh tools/*.sh tests/*.sh
          tests/edge_version_test.sh
          tests/edge_release_test.sh
          tests/install_test.sh
          tests/publish_edge_test.sh
      - name: Size and startup budget
        if: runner.os == 'Linux'
        run: zig build perf

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            target: x86_64-linux
            os: blacksmith-2vcpu-ubuntu-2404
          - platform: linux-aarch64
            target: aarch64-linux
            os: blacksmith-2vcpu-ubuntu-2404
          - platform: macos-x86_64
            target: x86_64-macos
            os: blacksmith-6vcpu-macos-latest
          - platform: macos-aarch64
            target: aarch64-macos
            os: blacksmith-6vcpu-macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build edge package
        run: tools/package-edge.sh "${{ matrix.platform }}" "${{ matrix.target }}" "${GITHUB_SHA}"
      - name: Upload edge binary
        uses: actions/upload-artifact@v7
        with:
          path: dist/xaq-${{ matrix.platform }}-${{ github.sha }}
          archive: false
          if-no-files-found: error
          retention-days: 1
      - name: Upload edge archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/xaq-${{ matrix.platform }}-${{ github.sha }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 1

  edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, package]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      EDGE_BASE_VERSION: 0.1.0
    concurrency:
      group: edge
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download edge builds
        uses: actions/download-artifact@v8
        with:
          # upload-artifact v7 names an archive:false artifact after its one file.
          pattern: xaq-*
          path: dist
          merge-multiple: true
      - name: Choose edge version
        id: edge_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tools/next-edge-version.sh "$EDGE_BASE_VERSION" "$GITHUB_REPOSITORY" "$GITHUB_SHA")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Prepare edge manifest
        run: tools/prepare-edge.sh dist "${GITHUB_SHA}"
      - name: Publish edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/publish-edge.sh dist "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" "${{ steps.edge_version.outputs.version }}"
